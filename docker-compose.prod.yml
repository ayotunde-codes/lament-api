services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: []

  api:
    build:
      context: .
      target: production
    container_name: lament-api
    env_file: .env.production
    environment:
      - NODE_ENV=production
    volumes: []
    restart: always
